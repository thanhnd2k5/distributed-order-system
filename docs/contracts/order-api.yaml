openapi: 3.0.3
info:
  title: POS Order API
  version: 1.0.0
servers:
  - url: http://localhost:8081
paths:
  /api/menu:
    get:
      operationId: listMenu
      summary: List active dishes by dish ID
      responses:
        '200':
          description: Active dishes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuItem'
              example:
                - { dishId: CHAO_GA, name: Cháo gà }
                - { dishId: COM_GA, name: Cơm gà }
  /api/orders:
    post:
      operationId: createOrder
      summary: Commit an order and its outbox event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
            example:
              clientRequestId: db50282e-918a-4894-b6f1-d92ca1cb58c7
              items:
                - { dishId: COM_GA, quantity: 2 }
      responses:
        '201':
          description: New order committed
          headers:
            Location:
              $ref: '#/components/headers/OrderLocation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSummary'
        '200':
          description: Same request ID and items, existing order returned
          headers:
            Location:
              $ref: '#/components/headers/OrderLocation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSummary'
        '400':
          description: Invalid request, duplicate dish ID, or unknown or inactive dish
        '409':
          description: Request ID already used with different items
        '500':
          description: The operation failed
    get:
      operationId: listOrders
      summary: List up to 100 recent orders at this site, newest first
      responses:
        '200':
          description: Recent orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderSummary'
  /api/orders/{orderId}:
    get:
      operationId: getOrder
      summary: Read local order status and item snapshots
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Order with its item snapshots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetails'
        '400':
          description: Invalid order ID
        '404':
          description: Order not found at this site
components:
  headers:
    OrderLocation:
      description: Relative path of the order details
      schema: { type: string, example: /api/orders/d967e06a-090d-4abc-9fb2-c5ec54306e08 }
  schemas:
    MenuItem:
      type: object
      required: [dishId, name]
      properties:
        dishId: { type: string }
        name: { type: string }
    CreateOrder:
      type: object
      required: [clientRequestId, items]
      properties:
        clientRequestId:
          type: string
          format: uuid
          description: Generate once per order submission and reuse when retrying it.
        items:
          type: array
          minItems: 1
          maxItems: 100
          description: Each dish ID may appear once. Item order does not affect retries.
          items:
            type: object
            required: [dishId, quantity]
            properties:
              dishId: { type: string, minLength: 1, maxLength: 50 }
              quantity: { type: integer, format: int32, minimum: 1 }
    OrderSummary:
      type: object
      required: [orderId, sourceSiteId, status, failureReason, createdAt]
      properties:
        orderId: { type: string, format: uuid }
        sourceSiteId: { type: string, example: POS01 }
        status:
          type: string
          enum: [PENDING_INVENTORY, RESERVED, FAILED, DONE]
          description: B1 creates orders in PENDING_INVENTORY. Later consumers update the status.
        failureReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    OrderDetails:
      type: object
      required: [order, items]
      properties:
        order:
          $ref: '#/components/schemas/OrderSummary'
        items:
          type: array
          items:
            type: object
            required: [lineNo, dishId, dishName, quantity]
            properties:
              lineNo: { type: integer, minimum: 1 }
              dishId: { type: string }
              dishName: { type: string }
              quantity: { type: integer, minimum: 1 }
