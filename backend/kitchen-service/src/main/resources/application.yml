server:
  port: ${SERVER_PORT:8085}
spring:
  application:
    name: kitchen-service
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      accept-float-as-int: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/kitchen_db}
    username: ${DB_USERNAME:kitchen_app}
    password: ${DB_PASSWORD:kitchen_demo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:kitchen}
  flyway:
    enabled: true
    create-schemas: true
    default-schema: ${DB_SCHEMA:kitchen}
    schemas: ${DB_SCHEMA:kitchen}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092,localhost:19093,localhost:19094}
    consumer:
      group-id: ${KAFKA_GROUP_ID:kitchen-v1}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        "[max.poll.interval.ms]": 300000
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        "[enable.idempotence]": true
        "[max.block.ms]": 2000
        "[request.timeout.ms]": 2000
        "[delivery.timeout.ms]": 5000
    listener:
      ack-mode: record
      concurrency: 1
      auto-startup: ${KAFKA_LISTENER_AUTO_STARTUP:true}
kitchen:
  instance-id: ${INSTANCE_ID:kitchen-1}
outbox:
  enabled: ${OUTBOX_ENABLED:false}
management:
  endpoints:
    web:
      exposure:
        include: health
