server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: order-service
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      accept-float-as-int: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/pos01_orders}
    username: ${DB_USERNAME:order_app}
    password: ${DB_PASSWORD:order_demo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:pos01}
  flyway:
    enabled: true
    create-schemas: true
    default-schema: ${DB_SCHEMA:pos01}
    schemas: ${DB_SCHEMA:pos01}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092,localhost:19093,localhost:19094}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        "[enable.idempotence]": true
        "[max.block.ms]": 2000
        "[request.timeout.ms]": 2000
        "[delivery.timeout.ms]": 5000
    consumer:
      group-id: ${ORDER_STATUS_GROUP_ID:order-status-${SITE_ID:POS01}-v1}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate
      auto-startup: ${KAFKA_LISTENER_AUTO_STARTUP:true}
outbox:
  enabled: ${OUTBOX_ENABLED:false}
order:
  stale-threshold: ${ORDER_STALE_THRESHOLD:PT5M}
  pending-inventory-alert-after: ${ORDER_PENDING_ALERT_AFTER:PT10M}
  expiry-threshold: ${ORDER_EXPIRY_THRESHOLD:PT4H}
  expiry-warning-before: ${ORDER_EXPIRY_WARNING_BEFORE:PT1H}
  dlq-max-attempts: ${ORDER_DLQ_MAX_ATTEMPTS:5}
  probe-timeout-ms: ${ORDER_PROBE_TIMEOUT_MS:1500}
  send-timeout-ms: ${ORDER_SEND_TIMEOUT_MS:6000}
  inventory-base-url: ${INVENTORY_BASE_URL:http://localhost:8084}
  heartbeat-interval-ms: ${ORDER_HEARTBEAT_INTERVAL_MS:5000}
  heartbeat-enabled: ${ORDER_HEARTBEAT_ENABLED:true}
  cancel-message-cooking: "Cannot cancel: the kitchen has started cooking"
site:
  id: ${SITE_ID:POS01}
  source-type: ${SOURCE_TYPE:POS}
  instance-id: ${INSTANCE_ID:${SITE_ID:POS01}-1}
management:
  endpoints:
    web:
      exposure:
        include: health
