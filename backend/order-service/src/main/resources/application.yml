server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: order-service
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      accept-float-as-int: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/pos01_orders}
    username: ${DB_USERNAME:order_app}
    password: ${DB_PASSWORD:order_demo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:pos01}
  flyway:
    enabled: true
    create-schemas: true
    default-schema: ${DB_SCHEMA:pos01}
    schemas: ${DB_SCHEMA:pos01}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092,localhost:19093,localhost:19094}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        "[enable.idempotence]": true
        "[max.block.ms]": 2000
        "[request.timeout.ms]": 2000
        "[delivery.timeout.ms]": 5000
outbox:
  enabled: ${OUTBOX_ENABLED:false}
site:
  id: ${SITE_ID:POS01}
  source-type: ${SOURCE_TYPE:POS}
management:
  endpoints:
    web:
      exposure:
        include: health
