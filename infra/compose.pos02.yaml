name: distributed-order-pos02
services:
  pos02-db:
    image: postgres:18.6
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_slot_wal_keep_size=1GB"
    environment:
      POSTGRES_DB: pos02_orders
      POSTGRES_USER: order_app
      POSTGRES_PASSWORD: order_demo
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - pos02-data:/var/lib/postgresql
    networks:
      default:
      order-replication-net:
        aliases:
          - pos02-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_app -d pos02_orders"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pos02-data:
networks:
  order-replication-net:
    name: order-replication-net
    external: true
