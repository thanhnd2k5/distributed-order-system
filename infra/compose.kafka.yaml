name: distributed-order-kafka

x-kafka: &kafka
  image: apache/kafka:4.1.2
  healthcheck:
    test: ["CMD-SHELL", "KAFKA_HEAP_OPTS='-Xms32m -Xmx128m' /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null"]
    interval: 10s
    timeout: 8s
    retries: 12
    start_period: 20s

x-kafka-env: &kafka-env
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  KAFKA_HEAP_OPTS: "-Xms256m -Xmx384m"
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:9094
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

services:
  kafka-1:
    <<: *kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,HOST://localhost:19092
    ports: ["127.0.0.1:19092:9094"]
    volumes: ["kafka-1-data:/var/lib/kafka/data"]
  kafka-2:
    <<: *kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,HOST://localhost:19093
    ports: ["127.0.0.1:19093:9094"]
    volumes: ["kafka-2-data:/var/lib/kafka/data"]
  kafka-3:
    <<: *kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,HOST://localhost:19094
    ports: ["127.0.0.1:19094:9094"]
    volumes: ["kafka-3-data:/var/lib/kafka/data"]
  kafka-init:
    image: apache/kafka:4.1.2
    profiles: [setup]
    environment:
      KAFKA_HEAP_OPTS: "-Xms32m -Xmx128m"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for topic in order-events status-events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092,kafka-2:9092,kafka-3:9092 \
            --create --if-not-exists --topic "$$topic" --partitions 3 \
            --replication-factor 3 --config min.insync.replicas=2
        done

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
