name: distributed-order-kafka

x-kafka: &kafka
  image: apache/kafka:4.1.2
  networks:
    - kafka-net
  healthcheck:
    test: ["CMD-SHELL", "KAFKA_HEAP_OPTS='-Xms32m -Xmx128m' /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null"]
    interval: 10s
    timeout: 8s
    retries: 24
    start_period: 20s

x-kafka-env: &kafka-env
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  KAFKA_HEAP_OPTS: "-Xms256m -Xmx384m"
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:9094
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
  KAFKA_LOG_RETENTION_MS: 604800000
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

services:
  kafka-1:
    <<: *kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,HOST://localhost:19092
    ports: ["127.0.0.1:19092:9094"]
    volumes: ["kafka-1-data:/var/lib/kafka/data"]
  kafka-2:
    <<: *kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,HOST://localhost:19093
    ports: ["127.0.0.1:19093:9094"]
    volumes: ["kafka-2-data:/var/lib/kafka/data"]
  kafka-3:
    <<: *kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,HOST://localhost:19094
    ports: ["127.0.0.1:19094:9094"]
    volumes: ["kafka-3-data:/var/lib/kafka/data"]
  kafka-init:
    image: apache/kafka:4.1.2
    profiles: [setup]
    networks:
      - kafka-net
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    environment:
      KAFKA_HEAP_OPTS: "-Xms32m -Xmx128m"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        BOOTSTRAP="kafka-1:9092,kafka-2:9092,kafka-3:9092"
        create_topic() {
          topic="$$1"
          partitions="$$2"
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$BOOTSTRAP" \
            --create --if-not-exists --topic "$$topic" --partitions "$$partitions" \
            --replication-factor 3 --config min.insync.replicas=2 --config retention.ms=604800000
        }
        for branch in POS01 POS02 ONLINE; do
          create_topic "order-events.$${branch}" 2
          create_topic "cancel-events.$${branch}" 2
          create_topic "status-events.$${branch}" 1
        done
        create_topic "kitchen-orders" 2
        create_topic "stock-commands" 2
        create_topic "menu-events" 1
        create_topic "dlq" 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$BOOTSTRAP" --describe

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:

networks:
  kafka-net:
    name: kafka-net
