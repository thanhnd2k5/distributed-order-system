name: distributed-order-test
services:
  test-db:
    image: postgres:18.6
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "fsync=off"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "full_page_writes=off"
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: test_app
      POSTGRES_PASSWORD: test_demo
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - ./postgres/init-test-dbs.sql:/docker-entrypoint-initdb.d/01-init-test-dbs.sql:ro
    networks:
      test-net:
        aliases:
          - test-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_app -d test_db"]
      interval: 3s
      timeout: 3s
      retries: 20
networks:
  test-net:
    name: test-net
