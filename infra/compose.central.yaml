name: distributed-order-central
services:
  central-db:
    image: postgres:18.6
    command:
      - "postgres"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_logical_replication_workers=8"
      - "-c"
      - "max_worker_processes=12"
    environment:
      POSTGRES_DB: central_orders_db
      POSTGRES_USER: central_app
      POSTGRES_PASSWORD: central_demo
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - central-data:/var/lib/postgresql
    networks:
      default:
      order-replication-net:
        aliases:
          - central-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U central_app -d central_orders_db"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  central-data:
networks:
  order-replication-net:
    name: order-replication-net
    external: true
