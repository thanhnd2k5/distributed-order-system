name: distributed-order-inventory
services:
  inventory-db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: inventory_app
      POSTGRES_PASSWORD: inventory_demo
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - inventory-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_app -d inventory_db"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  inventory-data:
